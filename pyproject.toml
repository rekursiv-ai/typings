# uv sync --all-groups --frozen

[project]
name = "rekursiv-ai-typings"
version = "2026.10.16"
description = "Hand-written type stubs for third-party libraries, for basedpyright and ty."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "rekursiv.ai", email = "hello@rekursiv.ai"}]
keywords = ["typing", "stubs", "pyi", "basedpyright", "ty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Stubs Only",
]
dependencies = []

[dependency-groups]
lint = ["ruff"]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.4.0",
    # build.py decodes ty's Zstandard archive with it below Python 3.14.
    "backports.zstd; python_version < '3.14'",
]
typecheck = [
    "basedpyright>=1.40.1",
    "ty>=0.0.84",
    "hatchling>=1.32.4",  # hatch_build.py subscripts its one-parameter BuildHookInterface.
    "rekursiv-ai-typeshed",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typecheck"},
]

[project.urls]
Homepage = "https://www.rekursiv.ai"
Repository = "https://github.com/rekursiv-ai/typings"
Source = "https://github.com/rekursiv-ai/typings"
Issues = "https://github.com/rekursiv-ai/typings/issues"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# Each `stubs/<pkg>/` ships as the PEP 561 package `<pkg>-stubs` (hatch_build.py),
# which both checkers find in site-packages with no configuration. Selecting
# `stubs` and then excluding it ships nothing by default; `bypass-selection`
# would instead also disable the hook's shared data.
[tool.hatch.build.targets.wheel]
only-include = ["stubs"]
exclude = ["/stubs"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["stubs", "hatch_build.py", "README.md"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
addopts = "-m 'not compute_large_fixture'"
markers = ["compute_large_fixture: materializes a large but local fixture"]
timeout = 60
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["stubs", "typeshed/rekursiv_ai_typeshed/typings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with the formatter.
    "CPY001",  # License is in LICENSE, not per-file.
    "D203",    # Conflicts with D211.
    "D213",    # Conflicts with D212.
    "E501",    # Line too long.
    "EM101",   # Raw string in exception.
    "EM102",   # F-string in exception.
    "PLR2004", # Magic value comparison.
    "S101",    # Use of `assert` detected.
    "TC006",   # Runtime cast value; needed for ty/basedpyright.
    "TRY003",  # Raise vanilla args.
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["ANN", "D", "INP001", "PLC2701", "SLF001"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true
default-section = "third-party"
from-first = true
lines-between-types = 1
lines-after-imports = 2
extra-standard-library = ["typing", "typing_extensions", "ty_extensions"]
known-first-party = ["rekursiv_ai_typeshed"]
no-lines-before = ["future"]
order-by-type = true

[tool.basedpyright]
typeCheckingMode = "recommended"
failOnWarnings = true
include = ["typeshed", "hatch_build.py"]
exclude = ["stubs", "**/rekursiv_ai_typeshed/typings", "**/.venv"]
typeshedPath = ".venv/share/rekursiv-ai-typeshed/basedpyright"
pythonVersion = "3.12"
reportPrivateUsage = false
reportUnannotatedClassAttribute = false  # Class attributes don't always need annotations.
reportUnusedCallResult = false

[tool.ty.environment]
python-version = "3.12"
typeshed = ".venv/share/rekursiv-ai-typeshed/ty"

[tool.ty.src]
include = ["typeshed", "hatch_build.py"]
exclude = ["stubs", "**/rekursiv_ai_typeshed/typings"]

[tool.ty.terminal]
error-on-warning = true

[tool.uv.extra-build-dependencies]
rekursiv-ai-typeshed = [
    {requirement = "basedpyright", match-runtime = true},
    {requirement = "ty", match-runtime = true},
]

[tool.uv.sources]
rekursiv-ai-typeshed = { path = "typeshed" }
