[project]
name = "rekursiv-ai-typeshed"
version = "0.1.7"
description = "Standard-library stubs for ty and basedpyright, with x ** 0.5 typed as float."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "rekursiv.ai", email = "hello@rekursiv.ai"}]
keywords = ["typing", "typeshed", "pyi", "basedpyright", "ty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Stubs Only",
]
dependencies = ["basedpyright>=1.40.1", "ty>=0.0.84"]

[project.urls]
Homepage = "https://www.rekursiv.ai"
Repository = "https://github.com/rekursiv-ai/typings"
Source = "https://github.com/rekursiv-ai/typings/tree/main/typeshed"
Issues = "https://github.com/rekursiv-ai/typings/issues"
Changelog = "https://github.com/rekursiv-ai/typings/releases"

[build-system]
requires = [
    "hatchling>=1.32.4",
    "basedpyright>=1.40.1",
    "ty>=0.0.84",
    # Decodes ty's Zstandard archive where ``zipfile`` cannot (build.py).
    "backports.zstd; python_version < '3.14'",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rekursiv_ai_typeshed"]
exclude = ["rekursiv_ai_typeshed/hatch_build.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "rekursiv_ai_typeshed/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["rekursiv_ai_typeshed", "README.md"]

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "../uv.lock"},
    {file = "README.md"},
    {file = "rekursiv_ai_typeshed/*.py"},
    {file = "rekursiv_ai_typeshed/py.typed"},
    {file = "rekursiv_ai_typeshed/typeshed.patch"},
    {file = "rekursiv_ai_typeshed/typings/**/*.pyi"},
]

[tool.uv.extra-build-dependencies]
rekursiv-ai-typeshed = [
    {requirement = "basedpyright", match-runtime = true},
    {requirement = "ty", match-runtime = true},
]
